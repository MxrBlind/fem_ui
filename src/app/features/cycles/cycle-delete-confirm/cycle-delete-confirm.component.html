<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <p class="mat-body-large">{{ message }}</p>
  <p class="cycle-delete-confirm__summary mat-body-medium">{{ summary }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancelar</button>
  <button
    mat-flat-button
    color="warn"
    type="button"
    data-testid="cycle-delete-confirm"
    (click)="onConfirm()"
  >
    Eliminar
  </button>
</mat-dialog-actions>
