<mat-toolbar color="primary">
  <button
    mat-icon-button
    aria-label="Toggle navigation"
    (click)="toggleSidenav()"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <span class="toolbar-title">FEM - Control escolar</span>

  <button
    mat-button
    [matMenuTriggerFor]="profileMenu"
    aria-label="User profile menu"
  >
    <mat-icon>account_circle</mat-icon>
    @if (user(); as u) {
      {{ u.username }}
    }
  </button>

  <mat-menu #profileMenu="matMenu">
    <button mat-menu-item (click)="onProfileAction('perfil')">Mi perfil</button>
    <button mat-menu-item aria-label="Cerrar sesión" (click)="logout()">Salir</button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" [opened]="sidenavOpen()">
    @if (user(); as u) {
      <div class="sidebar-profile">
        <span class="sidebar-profile__avatar" aria-hidden="true">{{ initial() }}</span>
        <div class="sidebar-profile__info">
          <p class="sidebar-profile__name">{{ fullName() }}</p>
          <p class="sidebar-profile__role">{{ u.role | roleLabel }}</p>
          <a
            class="sidebar-profile__link"
            routerLink="/mi-perfil"
            aria-label="Ir a mi perfil"
          >Mi perfil</a>
        </div>
      </div>
      <mat-divider />
    }

    <mat-nav-list>
      <ng-container *hasRole="['admin', 'teacher', 'student']">
        <p class="nav-section-header">Ciclo escolar</p>

        <a mat-list-item routerLink="/ciclo-actual" routerLinkActive="active" *hasRole="['admin']">Ciclo actual</a>
        <a mat-list-item routerLink="/inscripciones" routerLinkActive="active" *hasRole="['admin', 'teacher']">Inscripciones</a>
        <a mat-list-item routerLink="/ciclos" routerLinkActive="active" *hasRole="['admin']">Ciclos</a>
        <a mat-list-item routerLink="/grades" routerLinkActive="active" *hasRole="['student']">Calificaciones</a>
      </ng-container>

      <ng-container *hasRole="['admin']">
        <mat-divider />
        <p class="nav-section-header">Catálogos</p>

        <a mat-list-item routerLink="/teachers" routerLinkActive="active">Maestros</a>
        <a mat-list-item routerLink="/students" routerLinkActive="active">Estudiantes</a>
        <a mat-list-item routerLink="/subjects" routerLinkActive="active">Materias</a>
      </ng-container>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
